      - name: Controlling Structured Explanations via Shapley Values
        summary: Advised by Prof. Sinisa Todorovic.
        start_date: 2024-09
        end_date: 2025-05
        highlights:
          - Proposed a Shapley value-based framework to analyze and regulate structured explanations of deep networks.
