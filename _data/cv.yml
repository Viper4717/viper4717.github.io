      - name: Efficient Compilation Algorithm for Object-oriented Bayesian Networks
        summary: Advised by Prof. Chowdhury Farhan Ahmed and Dr. Md Samiullah.
        start_date: 2022-09
        end_date: 2023-04
        highlights:
          - Published in International Conference on Tools for Artificial Intelligence (ICTAI 2023).
          - Proposed a Connectable and Independent Junction Tree (CIC) algorithm to compile OOBNs without flattening.
          - Enabled reuse of component-level junction trees, reducing compilation time and improving scalability for large networks.
          - Achieved exponential reduction in compilation complexity compared to conventional BN flattening methods.

